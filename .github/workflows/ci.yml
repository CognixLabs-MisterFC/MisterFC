name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Guard de runtime que `next build` NO caza: un fichero 'use server' que
      # exporte algo que no sea una función async peta la ruta en producción.
      - name: Check "use server" exports
        run: pnpm check:use-server

      # Censo de senders de invitación: quien llame a inviteUserByEmail y cree la
      # cuenta DEBE enlazar invited_user_id después. El barrido de #540 buscó el
      # UPDATE en vez del ENVÍO y se dejó tres senders; este guard obliga a que un
      # sender nuevo pase por el contrato (link-invited-user.ts) antes de mergear.
      - name: Check invite senders census
        run: pnpm check:invite-senders

      # Censo de puntos de corte de la web para familias (W-B). La web tiene DOS
      # carcasas autenticadas y `/spectator` es HERMANA de `(authenticated)`: no
      # hereda su guard. Este censo obliga a que una carcasa nueva declare a qué
      # lado del corte cae, en vez de quedarse fuera en silencio.
      - name: Check family web cut census
        run: pnpm check:family-web-cut

      # El teclado tapaba el campo en la app nativa, y el fallo no era una libreria
      # ausente: era que el manejo se olvidaba pantalla a pantalla (15 de 17 sin
      # nada, y las 2 que lo tenian montaban el KeyboardAvoidingView de RN con
      # behavior undefined en Android). Este censo obliga a que una pantalla nueva
      # con un campo de texto declare como se aparta del teclado.
      - name: Check keyboard census (nativa)
        run: pnpm check:teclado

      - name: Test (vitest)
        run: pnpm test

      - name: Build web
        run: pnpm --filter web build

  # ───────────────────────────────────────────────────────────────────────────
  # Empaquetado de apps/native con Metro — MISMO comando que un build de EAS.
  #
  # Caza fallos de RESOLUCIÓN de módulos al empaquetar (p.ej. el transitivo
  # react-native-css-interop de NativeWind, no resoluble desde la app bajo el
  # node_modules estricto de pnpm) que `typecheck` y `lint` NO detectan porque
  # no empaquetan. Si el bundle no se genera, el step sale en rojo y para el PR
  # ANTES de gastar un build de EAS. Solo Android: el bundle de JS es común, no
  # hace falta iOS. La salida va a $RUNNER_TEMP → no se commitea nada.
  # ───────────────────────────────────────────────────────────────────────────
  native-bundle:
    name: native · bundle Android (Metro)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle apps/native (Android)
        working-directory: apps/native
        run: |
          pnpm expo export:embed --eager --platform android --dev false \
            --bundle-output "$RUNNER_TEMP/native-bundle.js" \
            --assets-dest "$RUNNER_TEMP/native-assets"
          test -s "$RUNNER_TEMP/native-bundle.js"

  # ───────────────────────────────────────────────────────────────────────────
  # F15-B — Suite pgTAP (RLS) contra una BD Supabase EFÍMERA por PR.
  #
  # Hermético: `supabase start` levanta un stack local en el runner (Docker),
  # aplica las 179 migraciones EN LIMPIO y trae el esquema `storage` (2 tests lo
  # necesitan). La suite corre con DATABASE_URL apuntando a la BD local
  # (127.0.0.1:54322) → NO usa secrets ni toca producción, y cada PR tiene su
  # propia BD (concurrencia resuelta por construcción).
  #
  # Bloqueante como el resto: si un test o una migración falla, el PR se para.
  # ───────────────────────────────────────────────────────────────────────────
  pgtap:
    name: pgTAP · RLS (BD efímera)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # CLI PINEADO a 2.98.2. Aquí el pin SÍ importa: `supabase start` corre código
      # del CLI. Lo que decía esta nota —«v2.99+ rompe el flujo db»— no tiene ninguna
      # medición detrás: el pin está sin tocar desde el primer commit (Fase 1, mayo
      # 2026). Subirlo es un cambio propio, que se valida con este mismo job y un
      # `db push --dry-run`. Ver docs/architecture/supabase-cli-without-link.md.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      # Levanta el stack local y APLICA las 179 migraciones en limpio. Si alguna
      # migración falla (un club nuevo no se podría crear desde cero), este paso
      # sale en rojo y para el PR.
      - name: supabase start (aplica las 239 migraciones en limpio)
        run: supabase start

      # Red de verificación del propio stack antes de correr la suite:
      #  · el esquema `storage` existe (si no, los 2 tests de storage fallarían).
      #  · las 239 migraciones quedaron registradas (clean apply completo).
      - name: Verificar storage + recuento de migraciones
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "→ ¿esquema storage presente?"
          psql "$DB" -tAc "select count(*) from information_schema.tables where table_schema='storage' and table_name='objects';" | grep -qx 1
          echo "  OK: storage.objects existe"
          echo "→ migraciones aplicadas vs ficheros en el repo:"
          APPLIED=$(psql "$DB" -tAc "select count(*) from supabase_migrations.schema_migrations;")
          FILES=$(ls supabase/migrations/*.sql | wc -l)
          echo "  aplicadas=$APPLIED  ficheros=$FILES"
          test "$APPLIED" -eq "$FILES"

      # La suite pgTAP contra la BD local vía el override DATABASE_URL del script
      # (scripts/supabase-cli.sh). Sin DATABASE_URL el script seguiría yendo al
      # remoto — aquí lo forzamos a local. Bloqueante: rc != 0 => PR en rojo.
      - name: pgTAP suite (111/111)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm db:test
