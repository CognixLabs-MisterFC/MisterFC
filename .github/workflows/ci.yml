name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Guard de runtime que `next build` NO caza: un fichero 'use server' que
      # exporte algo que no sea una función async peta la ruta en producción.
      - name: Check "use server" exports
        run: pnpm check:use-server

      # Censo de senders de invitación: quien llame a inviteUserByEmail y cree la
      # cuenta DEBE enlazar invited_user_id después. El barrido de #540 buscó el
      # UPDATE en vez del ENVÍO y se dejó tres senders; este guard obliga a que un
      # sender nuevo pase por el contrato (link-invited-user.ts) antes de mergear.
      - name: Check invite senders census
        run: pnpm check:invite-senders

      # Censo de puntos de corte de la web para familias (W-B). La web tiene DOS
      # carcasas autenticadas y `/spectator` es HERMANA de `(authenticated)`: no
      # hereda su guard. Este censo obliga a que una carcasa nueva declare a qué
      # lado del corte cae, en vez de quedarse fuera en silencio.
      - name: Check family web cut census
        run: pnpm check:family-web-cut

      # `@misterfc/core/rules` es la entrada de core SIN cliente de Supabase. Existe
      # porque importar el barrel en un test de logica pura de la nativa sube el
      # `collect` de 0,3 s a 10,4 s, y por eso habia reglas de core COPIADAS A MANO
      # alli. Si alguien reexporta desde rules.ts algo que arrastra el cliente, la
      # entrada deja de ser barata EN SILENCIO -los tests pasan, solo que diez veces
      # mas lentos- y la siguiente persona vuelve a copiar la regla.
      - name: Check core pure-rules entry
        run: pnpm check:core-rules-puras

      # El teclado tapaba el campo en la app nativa, y el fallo no era una libreria
      # ausente: era que el manejo se olvidaba pantalla a pantalla (15 de 17 sin
      # nada, y las 2 que lo tenian montaban el KeyboardAvoidingView de RN con
      # behavior undefined en Android). Este censo obliga a que una pantalla nueva
      # con un campo de texto declare como se aparta del teclado.
      - name: Check keyboard census (nativa)
        run: pnpm check:teclado

      # `va` no es un locale de Intl y NO falla: cae a en-US en silencio, asi que la
      # web llevaba desde siempre pintando las fechas en INGLES a quien la tiene en
      # valenciano. El mapeo ya existia escrito TRES veces y cubria 10 de 49 sitios:
      # esto no se arregla una vez, se olvida fichero a fichero.
      - name: Check intl locale census (web)
        run: pnpm check:intl-locale

      # Una clave del catalogo que se queda sin uso no rompe nada: los mensajes de
      # next-intl no estan tipados, asi que no hay error de tipos ni de lint, y el
      # traductor la sigue traduciendo a tres idiomas. Se acumulan en silencio: al
      # escribir el guard habia 57. Las excepciones, si alguna vez hace falta alguna,
      # van declaradas EN EL SCRIPT -con fecha y motivo, y se van con su PR-, no aqui:
      # el numero que hubiera escrito aqui no lo comprueba nadie. Hoy la lista esta
      # vacia y el propio guard lo dice en cada run. Una cadena NUEVA sin uso pone
      # esto rojo.
      - name: Check dead catalogue strings census
        run: pnpm check:cadenas-muertas

      # Legal-1 — un texto legal tiene UNA copia, los .md del abogado (Documentos/). La
      # que sirve la web se genera en el build, no se versiona y por eso no puede
      # divergir. Lo que este guard vigila ahora es la CADENA que lleva la maestra hasta
      # la pagina: generador enchufado a build y dev, maestra dentro de las entradas de
      # turbo (o se publica el texto viejo desde la cache) y en el trace de despliegue
      # (o la pagina va bien en local y da 500 en produccion). Nada de eso da error solo.
      - name: Check legal texts census
        run: pnpm check:textos-legales

      # Las plantillas de correo viven en el dashboard de Supabase: sin revision, sin
      # diff y sin que nadie se entere si cambian. supabase/emails/ es la copia
      # revisada. Este guard NO habla con Supabase (este workflow no tiene secretos, y
      # asi se queda): comprueba la copia contra si misma y contra INVITE_KINDS. Para
      # comparar con lo VIVO hay `pnpm plantillas:diff`, que se lanza a mano.
      - name: Check email templates copy
        run: pnpm check:plantillas-correo

      # El octavo correo de Correo-B es el unico que se pide SIN SESION, y tiene dos
      # formas de romperse mudo: un texto que falte en un idioma (excepcion en el
      # envio, solo para ese idioma) y el destino del enlace, que fue el BUG 4.
      - name: Check recovery email
        run: pnpm check:correo-recuperacion

      - name: Test (vitest)
        run: pnpm test

      - name: Build web
        run: pnpm --filter web build

  # ───────────────────────────────────────────────────────────────────────────
  # Empaquetado de apps/native con Metro — MISMO comando que un build de EAS.
  #
  # Caza fallos de RESOLUCIÓN de módulos al empaquetar (p.ej. el transitivo
  # react-native-css-interop de NativeWind, no resoluble desde la app bajo el
  # node_modules estricto de pnpm) que `typecheck` y `lint` NO detectan porque
  # no empaquetan. Si el bundle no se genera, el step sale en rojo y para el PR
  # ANTES de gastar un build de EAS. Solo Android: el bundle de JS es común, no
  # hace falta iOS. La salida va a $RUNNER_TEMP → no se commitea nada.
  # ───────────────────────────────────────────────────────────────────────────
  native-bundle:
    name: native · bundle Android (Metro)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle apps/native (Android)
        working-directory: apps/native
        run: |
          pnpm expo export:embed --eager --platform android --dev false \
            --bundle-output "$RUNNER_TEMP/native-bundle.js" \
            --assets-dest "$RUNNER_TEMP/native-assets"
          test -s "$RUNNER_TEMP/native-bundle.js"

  # ───────────────────────────────────────────────────────────────────────────
  # F15-B — Suite pgTAP (RLS) contra una BD Supabase EFÍMERA por PR.
  #
  # Hermético: `supabase start` levanta un stack local en el runner (Docker),
  # aplica TODAS las migraciones EN LIMPIO y trae el esquema `storage` (los tests
  # de storage lo necesitan). La suite corre con DATABASE_URL apuntando a la BD local
  # (127.0.0.1:54322) → NO usa secrets ni toca producción, y cada PR tiene su
  # propia BD (concurrencia resuelta por construcción).
  #
  # Bloqueante como el resto: si un test o una migración falla, el PR se para.
  # ───────────────────────────────────────────────────────────────────────────
  pgtap:
    name: pgTAP · RLS (BD efímera)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # CLI PINEADO a 2.98.2. Aquí el pin SÍ importa: `supabase start` corre código
      # del CLI. Lo que decía esta nota —«v2.99+ rompe el flujo db»— no tiene ninguna
      # medición detrás: el pin está sin tocar desde el primer commit (Fase 1, mayo
      # 2026). Subirlo es un cambio propio, que se valida con este mismo job y un
      # `db push --dry-run`. Ver docs/architecture/supabase-cli-without-link.md.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      # Levanta el stack local y APLICA TODAS las migraciones en limpio. Si alguna
      # migración falla (un club nuevo no se podría crear desde cero), este paso
      # sale en rojo y para el PR.
      - name: supabase start (aplica todas las migraciones en limpio)
        run: supabase start

      # Red de verificación del propio stack antes de correr la suite:
      #  · el esquema `storage` existe (si no, los tests de storage fallarían).
      #  · TODAS las migraciones quedaron registradas (clean apply completo).
      #
      # Aquí NO va ningún número escrito a mano. El recuento que vale es el de
      # abajo, `APPLIED -eq FILES`, que se mide en cada run: un número en un
      # comentario no lo comprueba nadie y envejece en silencio —este job decía
      # «las 240 migraciones» y «112/112» cuando ya iban por 246 y 116—, y leerlo
      # induce a pensar que algo lo está verificando.
      - name: Verificar storage + recuento de migraciones
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "→ ¿esquema storage presente?"
          psql "$DB" -tAc "select count(*) from information_schema.tables where table_schema='storage' and table_name='objects';" | grep -qx 1
          echo "  OK: storage.objects existe"
          echo "→ migraciones aplicadas vs ficheros en el repo:"
          APPLIED=$(psql "$DB" -tAc "select count(*) from supabase_migrations.schema_migrations;")
          FILES=$(ls supabase/migrations/*.sql | wc -l)
          echo "  aplicadas=$APPLIED  ficheros=$FILES"
          test "$APPLIED" -eq "$FILES"

      # La suite pgTAP contra la BD local vía el override DATABASE_URL del script
      # (scripts/supabase-cli.sh). Sin DATABASE_URL el script seguiría yendo al
      # remoto — aquí lo forzamos a local. Bloqueante: rc != 0 => PR en rojo.
      - name: pgTAP suite (la familia entera)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm db:test
